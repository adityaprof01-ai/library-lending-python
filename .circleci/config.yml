version: 2.1

jobs:
  secret-scan:
    docker:
      - image: zricethezav/gitleaks:latest
        entrypoint: ["/bin/sh"]
    steps:
      - checkout
      - run:
          name: 1. Run Gitleaks Secret Scan
          command: gitleaks detect --source=. --verbose --report-path=gitleaks.json --redact

  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install linter
          command: pip install ruff==0.4.8
      - run:
          name: 2. Run Ruff Linter
          command: ruff check .

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: 3. Run Unit Tests with Coverage
          command: |
            pytest tests/test_fines.py tests/test_unit_app.py \
              --cov=app \
              --cov-report=term-missing \
              --cov-fail-under=70

  integration-tests:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library
      - image: cimg/redis:7.2
    steps:
      - checkout
      - run:
          name: Install client utilities and dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y postgresql-client netcat-openbsd
            pip install -r requirements-dev.txt
      - run:
          name: Wait for Postgres & Redis
          command: |
            until pg_isready -h localhost -U postgres -d library; do
              echo "Waiting for postgres..."
              sleep 1
            done
            until nc -z localhost 6379; do
              echo "Waiting for redis..."
              sleep 1
            done
      - run:
          name: Apply migrations in order
          command: |
            for file in $(ls -1 migrations/*.sql | sort); do
              echo "Applying $file..."
              PGPASSWORD=postgres psql -h localhost -U postgres -d library -f "$file"
            done
      - run:
          name: 4. Run Integration Tests
          environment:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library
            REDIS_URL: redis://localhost:6379/0
          command: pytest tests/test_integration.py -v

  image-build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: 5 & 6. Build and Push Docker Image with Dual Tags
          command: |
            set -e

            DOCKER_USER="${DOCKERHUB_USER:-$DOCKERHUB_USERNAME}"
            DOCKER_TOKEN="${DOCKERHUB_TOKEN:-$DOCKERHUB_PASSWORD}"
            DOCKER_REPO="${DOCKERHUB_REPO:-library-lending-python}"

            SHORT_SHA=$(echo "${CIRCLE_SHA1}" | cut -c1-7)

            case "${CIRCLE_BRANCH}" in
              main)
                MOVING_TAG="qa"
                ;;
              staging)
                MOVING_TAG="stage"
                ;;
              prod)
                MOVING_TAG="prod"
                ;;
              *)
                MOVING_TAG="${CIRCLE_BRANCH}"
                ;;
            esac

            IMMUTABLE_TAG="${CIRCLE_BRANCH}-${SHORT_SHA}"

            TARGET_REPO="${DOCKER_USER:-library}/${DOCKER_REPO}"

            echo "=== Docker Build Configuration ==="
            echo "Branch: ${CIRCLE_BRANCH}"
            echo "Repository: ${TARGET_REPO}"
            echo "Moving Tag: ${TARGET_REPO}:${MOVING_TAG}"
            echo "Immutable Tag: ${TARGET_REPO}:${IMMUTABLE_TAG}"

            docker build \
              -t "${TARGET_REPO}:${MOVING_TAG}" \
              -t "${TARGET_REPO}:${IMMUTABLE_TAG}" \
              .

            if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_TOKEN" ]; then
              echo "Authenticating to Docker Hub as ${DOCKER_USER}..."
              echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USER" --password-stdin

              echo "Pushing moving tag: ${TARGET_REPO}:${MOVING_TAG}..."
              docker push "${TARGET_REPO}:${MOVING_TAG}"

              echo "Pushing immutable tag: ${TARGET_REPO}:${IMMUTABLE_TAG}..."
              docker push "${TARGET_REPO}:${IMMUTABLE_TAG}"

              echo "Successfully pushed both tags to Docker Hub."
            else
              echo "NOTE: DOCKERHUB_USER and DOCKERHUB_TOKEN are not set in CircleCI project environment variables."
              echo "Image built successfully, skipping push."
            fi

workflows:
  version: 2

  # QA pipeline on main (and PR / feature verification without push)
  qa-pipeline:
    jobs:
      - secret-scan:
          filters:
            branches:
              ignore:
                - staging
                - prod
      - lint:
          requires:
            - secret-scan
          filters:
            branches:
              ignore:
                - staging
                - prod
      - unit-tests:
          requires:
            - lint
          filters:
            branches:
              ignore:
                - staging
                - prod
      - integration-tests:
          requires:
            - unit-tests
          filters:
            branches:
              ignore:
                - staging
                - prod
      - image-build-and-push:
          requires:
            - integration-tests
          filters:
            branches:
              only:
                - main

  # Build-only on staging (No test stages)
  staging-pipeline:
    jobs:
      - image-build-and-push:
          filters:
            branches:
              only:
                - staging

  # Build-only on prod (No test stages)
  prod-pipeline:
    jobs:
      - image-build-and-push:
          filters:
            branches:
              only:
                - prod
