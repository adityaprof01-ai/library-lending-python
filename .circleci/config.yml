version: 2.1

jobs:
  lint:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install linter
          command: pip install ruff==0.4.8
      - run:
          name: Run Ruff linter
          command: ruff check .

  unit-tests:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Run unit tests with coverage
          command: |
            pytest tests/test_fines.py \
              --cov=app \
              --cov-report=term-missing \
              --cov-fail-under=70

  integration-tests:
    docker:
      - image: cimg/python:3.12
      - image: cimg/postgres:16.1
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: library
      - image: cimg/redis:7.2
    steps:
      - checkout
      - run:
          name: Install client utilities and dependencies
          command: |
            sudo apt-get update && sudo apt-get install -y postgresql-client
            pip install -r requirements-dev.txt
      - run:
          name: Wait for Postgres & Redis
          command: |
            until pg_isready -h localhost -U postgres -d library; do
              echo "Waiting for postgres..."
              sleep 1
            done
            until nc -z localhost 6379; do
              echo "Waiting for redis..."
              sleep 1
            done
      - run:
          name: Apply migrations in order
          command: |
            for file in $(ls -1 migrations/*.sql | sort); do
              echo "Applying $file..."
              PGPASSWORD=postgres psql -h localhost -U postgres -d library -f "$file"
            done
      - run:
          name: Run integration tests
          environment:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/library
            REDIS_URL: redis://localhost:6379/0
          command: pytest tests/test_integration.py -v

  secret-scan:
    docker:
      - image: zricethezav/gitleaks:latest
        entrypoint: ["/bin/sh"]
    steps:
      - checkout
      - run:
          name: Run Gitleaks Secret Scan
          command: gitleaks detect --source=. --verbose --report-path=gitleaks.json --redact

  image-build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build Docker image
          command: |
            IMAGE_TAG="${DOCKERHUB_USERNAME:-library}/library-lending:1.0"
            docker build -t "$IMAGE_TAG" .
      - run:
          name: Push to Docker Hub
          command: |
            if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
              echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
              docker push "${DOCKERHUB_USERNAME}/library-lending:1.0"
            else
              echo "Docker Hub credentials not configured. Image built successfully without push."
            fi

workflows:
  version: 2
  pipeline:
    jobs:
      - lint
      - unit-tests:
          requires:
            - lint
      - integration-tests:
          requires:
            - unit-tests
      - secret-scan:
          requires:
            - integration-tests
      - image-build:
          requires:
            - secret-scan
